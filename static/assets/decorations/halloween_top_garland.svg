<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 110" width="100%" height="110" preserveAspectRatio="none" fill="none">
  <defs>
    <filter id="garland-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#180b2b" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <linearGradient id="flag-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="flag-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="flag-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="flag-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="flag-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Twine / Stitched Hanging Garland Rope (Sagging curve) -->
  <path d="M 0 10 Q 360 42 720 40 Q 1080 42 1440 10" 
        stroke="#472b62" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 0 10 Q 360 42 720 40 Q 1080 42 1440 10" 
        stroke="#fde047" stroke-width="1.8" stroke-dasharray="6,5" stroke-linecap="round" fill="none"/>

  <!-- FLAGS GROUP -->
  <g filter="url(#garland-shadow)">
    <!-- Flag 1: ✦ (Gold) -->
    <g transform="translate(180, 22) rotate(-4)">
      <polygon points="0,0 36,0 36,46 18,34 0,46" fill="url(#gold-foil)" stroke="#1e1b4b" stroke-width="2"/>
      <line x1="4" y1="4" x2="32" y2="4" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="18" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#1e1b4b" text-anchor="middle">✦</text>
    </g>

    <!-- Flag 2: H (Purple) -->
    <g transform="translate(230, 26) rotate(-3)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-purple)" stroke="#1e1b4b" stroke-width="2"/>
      <line x1="4" y1="4" x2="36" y2="4" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">H</text>
    </g>

    <!-- Flag 3: A (Orange) -->
    <g transform="translate(285, 30) rotate(-2)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-orange)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">A</text>
    </g>

    <!-- Flag 4: L (Lime) -->
    <g transform="translate(340, 33) rotate(-1)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-lime)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#1e1b4b" text-anchor="middle">L</text>
    </g>

    <!-- Flag 5: L (Pink) -->
    <g transform="translate(395, 35) rotate(-1)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-pink)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">L</text>
    </g>

    <!-- Flag 6: O (Yellow) -->
    <g transform="translate(450, 37) rotate(0)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-yellow)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#1e1b4b" text-anchor="middle">O</text>
    </g>

    <!-- Flag 7: W (Purple) -->
    <g transform="translate(505, 38) rotate(0)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-purple)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- Flag 8: E (Orange) -->
    <g transform="translate(560, 38) rotate(0)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-orange)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">E</text>
    </g>

    <!-- Flag 9: E (Lime) -->
    <g transform="translate(615, 38) rotate(0)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-lime)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#1e1b4b" text-anchor="middle">E</text>
    </g>

    <!-- Flag 10: N (Pink) -->
    <g transform="translate(670, 38) rotate(0)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-pink)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">N</text>
    </g>

    <!-- Center Icon Charm: 🎃 (Pumpkin Badge) -->
    <g transform="translate(725, 38) rotate(0)">
      <circle cx="20" cy="22" r="18" fill="#fb923c" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="28" font-size="20" text-anchor="middle">🎃</text>
    </g>

    <!-- Flag 11: 2 (Purple) -->
    <g transform="translate(780, 38) rotate(0)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-purple)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#fde047" text-anchor="middle">2</text>
    </g>

    <!-- Flag 12: 0 (Orange) -->
    <g transform="translate(835, 37) rotate(1)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-orange)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">0</text>
    </g>

    <!-- Flag 13: 2 (Lime) -->
    <g transform="translate(890, 35) rotate(1)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-lime)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#1e1b4b" text-anchor="middle">2</text>
    </g>

    <!-- Flag 14: 6 (Pink) -->
    <g transform="translate(945, 33) rotate(2)">
      <polygon points="0,0 40,0 40,54 20,40 0,54" fill="url(#flag-pink)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">6</text>
    </g>

    <!-- Flag 15: 👻 (Ghost Badge) -->
    <g transform="translate(1000, 30) rotate(2)">
      <circle cx="20" cy="22" r="18" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="2"/>
      <text x="20" y="28" font-size="20" text-anchor="middle">👻</text>
    </g>

    <!-- Flag 16: ✦ (Gold) -->
    <g transform="translate(1055, 26) rotate(3)">
      <polygon points="0,0 36,0 36,46 18,34 0,46" fill="url(#gold-foil)" stroke="#1e1b4b" stroke-width="2"/>
      <text x="18" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#1e1b4b" text-anchor="middle">✦</text>
    </g>
  </g>

  <!-- DANGLING CHARMS & CANDIES -->
  <!-- Charm 1: Left Mini Candy Corn -->
  <g transform="translate(222, 28)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="2,2"/>
    <g transform="translate(-8, 28)">
      <polygon points="8,0 0,20 16,20" fill="#fde047" stroke="#1e1b4b" stroke-width="1.5"/>
      <polygon points="8,0 3,12 13,12" fill="#fb923c"/>
      <polygon points="8,0 5,6 11,6" fill="#ffffff"/>
    </g>
  </g>

  <!-- Charm 2: Left Mini Bat -->
  <g transform="translate(442, 39)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2,2"/>
    <g transform="translate(-14, 24)">
      <path d="M 14 6 C 10 0 2 0 0 7 C 5 9 8 13 14 16 C 20 13 23 9 28 7 C 26 0 18 0 14 6 Z" 
            fill="#312e81" stroke="#c084fc" stroke-width="1.2"/>
      <circle cx="11" cy="9" r="1.5" fill="#facc15"/>
      <circle cx="17" cy="9" r="1.5" fill="#facc15"/>
    </g>
  </g>

  <!-- Charm 3: Dangling Little Spider with Web Thread -->
  <g transform="translate(720, 42)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="2,2"/>
    <g transform="translate(-10, 35)">
      <ellipse cx="10" cy="10" rx="8" ry="7" fill="#18181b" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="7" cy="9" r="2" fill="#a3e635"/>
      <circle cx="13" cy="9" r="2" fill="#a3e635"/>
      <!-- Legs -->
      <path d="M 2 7 Q -4 4 -2 1 M 2 10 Q -5 10 -3 14 M 18 7 Q 24 4 22 1 M 18 10 Q 25 10 23 14" 
            stroke="#18181b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Charm 4: Right Mini Star -->
  <g transform="translate(830, 39)">
    <line x1="0" y1="0" x2="0" y2="26" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="2,2"/>
    <g transform="translate(-8, 26)">
      <polygon points="8,0 10,6 16,8 11,12 12,18 8,14 4,18 5,12 0,8 6,6" fill="#facc15" stroke="#1e1b4b" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Charm 5: Right Mini Lollipop -->
  <g transform="translate(1050, 28)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="2,2"/>
    <g transform="translate(-8, 28)">
      <circle cx="8" cy="8" r="8" fill="#f43f5e" stroke="#1e1b4b" stroke-width="1.5"/>
      <path d="M 4 8 A 4 4 0 0 1 12 8" stroke="#ffffff" stroke-width="2" fill="none"/>
      <line x1="8" y1="16" x2="8" y2="25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>

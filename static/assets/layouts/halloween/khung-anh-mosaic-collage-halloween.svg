<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="lay-sh-07" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="translate(50, 50)" filter="url(#lay-sh-07)">
    <!-- Base Card -->
    <rect x="0" y="0" width="500" height="500" rx="18" fill="#fff" stroke="#000" stroke-width="3"/>
    <!-- Quad 4 Photo Windows -->
    <rect x="25" y="25" width="215" height="205" rx="10" fill="#181126" stroke="#ea580c" stroke-width="2"/>
    <text x="132" y="130" font-family="'Patrick Hand', cursive" font-size="16" fill="#f97316" text-anchor="middle">ẢNH 01 (BÍ NGÔ)</text>

    <rect x="260" y="25" width="215" height="205" rx="10" fill="#181126" stroke="#a855f7" stroke-width="2"/>
    <text x="367" y="130" font-family="'Patrick Hand', cursive" font-size="16" fill="#c084fc" text-anchor="middle">ẢNH 02 (MA QUÁI)</text>

    <rect x="25" y="250" width="215" height="205" rx="10" fill="#181126" stroke="#84cc16" stroke-width="2"/>
    <text x="132" y="355" font-family="'Patrick Hand', cursive" font-size="16" fill="#a3e635" text-anchor="middle">ẢNH 03 (TIỆC VUI)</text>

    <rect x="260" y="250" width="215" height="205" rx="10" fill="#181126" stroke="#ec4899" stroke-width="2"/>
    <text x="367" y="355" font-family="'Patrick Hand', cursive" font-size="16" fill="#f472b6" text-anchor="middle">ẢNH 04 (TRICK OR TREAT)</text>

    <!-- Center Badge Connector -->
    <circle cx="250" cy="240" r="28" fill="#fde047" stroke="#000" stroke-width="3"/>
    <text x="250" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#000" text-anchor="middle">BOO!</text>
  </g>
</svg>
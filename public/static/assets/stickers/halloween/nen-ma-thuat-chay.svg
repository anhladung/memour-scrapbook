    <path d="M100 18 C115 35 110 52 100 52 C90 52 85 35 100 18 Z" fill="#38bdf8"/>
    <path d="M100 28 C108 38 105 50 100 50 C95 50 92 38 100 28 Z" fill="#fef08a"/>

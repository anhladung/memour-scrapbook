<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" fill="none">
  <defs>
    <!-- Drop Shadows for Die-Cut Scrapbook Stickers -->
    <filter id="sticker-shadow-br" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-3" dy="-4" stdDeviation="4" flood-color="#0f0c29" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Polka Dot Pink Candy Washi Pattern -->
    <pattern id="candy-dots-pink" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f43f5e"/>
      <circle cx="8" cy="8" r="3" fill="#fef08a"/>
      <circle cx="0" cy="0" r="2" fill="#a855f7"/>
      <circle cx="16" cy="0" r="2" fill="#a855f7"/>
      <circle cx="0" cy="16" r="2" fill="#a855f7"/>
      <circle cx="16" cy="16" r="2" fill="#a855f7"/>
    </pattern>

    <!-- Bat Washi Tape Pattern -->
    <pattern id="bat-tape" width="28" height="20" patternUnits="userSpaceOnUse">
      <rect width="28" height="20" fill="#18181b"/>
      <!-- Tiny Orange Bat Silhouette -->
      <path d="M 6 12 L 10 7 L 12 10 L 14 6 L 16 10 L 18 7 L 22 12 L 18 16 L 14 13 L 10 16 Z" fill="#f97316"/>
    </pattern>
  </defs>

  <!-- 1. SCRAPBOOK ALBUM CORNER BASE (Cream Paper with Photo Mounts & Stitches) -->
  <g transform="translate(160, 160)" filter="url(#sticker-shadow-br)">
    <!-- Scrapbook Paper Corner -->
    <path d="M 40 200 L 200 200 L 200 40 L 170 30 L 140 45 L 110 32 L 80 50 L 50 40 L 30 70 L 45 100 L 30 130 L 45 160 Z" 
          fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <!-- Page Grid Pattern Lines -->
    <path d="M 60 190 L 190 190 L 190 60" fill="none" stroke="#fed7aa" stroke-width="1.2" stroke-dasharray="3,3"/>
    
    <!-- Photo Corner Mounts (Vintage Scrapbook Photo Corners) -->
    <!-- Inner Photo Corner (Orange) -->
    <polygon points="195,145 195,195 145,195" fill="#f97316" stroke="#c2410c" stroke-width="1.2"/>
    <circle cx="178" cy="178" r="3.5" fill="#fef08a"/>
  </g>

  <!-- 2. BAT WASHI TAPE STRIP (Midnight Black with Orange Bats, Pinned Across) -->
  <g transform="translate(200, 290) rotate(16)" filter="url(#sticker-shadow-br)">
    <path d="M 0 0 L 140 0 L 137 14 L 140 28 L 0 28 L 3 14 Z" 
          fill="url(#bat-tape)" stroke="#f97316" stroke-width="1.2"/>
    <line x1="8" y1="14" x2="132" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="4,4"/>
  </g>

  <!-- 3. VINTAGE KRAFT LUGGAGE TAG TIED WITH TWINE -->
  <g transform="translate(70, 155) rotate(-15)" filter="url(#sticker-shadow-br)">
    <!-- Luggage Tag Body (Die-Cut Kraft) -->
    <!-- White Die-Cut Border -->
    <path d="M 20 0 L 105 0 C 110 0 115 5 115 10 L 115 65 C 115 70 110 75 105 75 L 20 75 L 0 55 L 0 20 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
    <!-- Kraft Card Tag -->
    <path d="M 20 2 L 105 2 C 109 2 113 6 113 10 L 113 65 C 113 69 109 73 105 73 L 20 73 L 2 54 L 2 21 Z" 
          fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    
    <!-- Stitched Seam on Tag -->
    <path d="M 22 8 L 105 8 L 105 67 L 22 67 L 8 50 L 8 25 Z" 
          fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Brass Reinforcement Ring for Tag Hole -->
    <circle cx="15" cy="37.5" r="6" fill="#f59e0b" stroke="#92400e" stroke-width="1"/>
    <circle cx="15" cy="37.5" r="3" fill="#ffffff"/>

    <!-- Baker's Twine (Candy-striped string looping from hole) -->
    <path d="M 12 37 C -15 32 -30 15 -45 -10" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 37 C -15 32 -30 15 -45 -10" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="4,4"/>

    <!-- Stamped Badge Text -->
    <text x="62" y="28" font-family="'Patrick Hand', 'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="900" fill="#7c2d12" text-anchor="middle">MEMOUR • DIY</text>
    <rect x="25" y="34" width="76" height="18" rx="3" fill="#7c3aed"/>
    <text x="63" y="47" font-family="'Patrick Hand', 'Comic Sans MS', cursive, sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">✦ HALLOWEEN ✦</text>
    <text x="63" y="63" font-family="'Patrick Hand', cursive, sans-serif" font-size="9" font-weight="bold" fill="#ea580c" text-anchor="middle">Every memory has a story</text>
  </g>

  <!-- 4. HANDMADE CRAFT WITCH BROOMSTICK -->
  <g transform="translate(190, 110) rotate(42)" filter="url(#sticker-shadow-br)">
    <!-- White Die-Cut Border -->
    <rect x="2" y="-4" width="8" height="150" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="5"/>
    <path d="M -8 115 L 20 115 L 30 170 L -18 170 Z" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Wooden Twig Handle -->
    <rect x="3" y="-2" width="6" height="125" rx="3" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    
    <!-- Straw Bristles (Craft Twine Bundle) -->
    <path d="M -6 118 L 18 118 L 26 168 L -14 168 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/>
    <line x1="-2" y1="120" x2="-8" y2="166" stroke="#d97706" stroke-width="1.2"/>
    <line x1="3" y1="120" x2="3" y2="167" stroke="#d97706" stroke-width="1.2"/>
    <line x1="8" y1="120" x2="10" y2="167" stroke="#d97706" stroke-width="1.2"/>
    <line x1="14" y1="120" x2="20" y2="166" stroke="#d97706" stroke-width="1.2"/>

    <!-- Ribbon Bow tying the Broom -->
    <rect x="-8" y="122" width="28" height="8" rx="2" fill="#ec4899" stroke="#be185d" stroke-width="1"/>
    <circle cx="6" cy="126" r="3.5" fill="#f472b6"/>
  </g>

  <!-- 5. WRAPPED CANDIES & SWEETS STICKERS -->
  <!-- Wrapped Candy #1 (Pink/Yellow polka dots) -->
  <g transform="translate(130, 260) rotate(-20)" filter="url(#sticker-shadow-br)">
    <!-- White outline -->
    <ellipse cx="20" cy="14" rx="28" ry="16" fill="#ffffff"/>
    <!-- Left twist wrapper -->
    <polygon points="4,14 -4,6 -4,22" fill="#a855f7" stroke="#7e22ce" stroke-width="1"/>
    <!-- Right twist wrapper -->
    <polygon points="36,14 44,6 44,22" fill="#a855f7" stroke="#7e22ce" stroke-width="1"/>
    <!-- Candy Center Body -->
    <ellipse cx="20" cy="14" rx="16" ry="11" fill="url(#candy-dots-pink)" stroke="#9f1239" stroke-width="1.2"/>
  </g>

  <!-- Wrapped Candy #2 (Slime Green Candy Twist) -->
  <g transform="translate(260, 230) rotate(35)" filter="url(#sticker-shadow-br)">
    <polygon points="4,10 -2,4 -2,16" fill="#ea580c"/>
    <polygon points="26,10 32,4 32,16" fill="#ea580c"/>
    <ellipse cx="15" cy="10" rx="12" ry="8" fill="#84cc16" stroke="#4d7c0f" stroke-width="1.2"/>
    <line x1="10" y1="5" x2="13" y2="15" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="16" y1="5" x2="19" y2="15" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- 6. SPARKLE STARS & DOODLES -->
  <g transform="translate(180, 80)">
    <path d="M 12 0 Q 12 8 20 8 Q 12 8 12 16 Q 12 8 4 8 Q 12 8 12 0 Z" fill="#facc15"/>
  </g>
  <!-- 7. HALLOWEEN 2026 NEO-BRUTALISM BADGE -->
  <g transform="translate(60, 260) rotate(-12)" filter="url(#sticker-shadow-br)">
    <rect x="0" y="0" width="145" height="34" rx="17" fill="#f43f5e" stroke="#18181b" stroke-width="2.5"/>
    <rect x="3" y="3" width="139" height="28" rx="14" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="72" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">✦ MEMOUR • 2026 ✦</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" fill="none">
  <defs>
    <filter id="book-shadow-02" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#7c3aed" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#ea580c" flood-opacity="0.2"/>
    </filter>
    <filter id="gold-emboss-02" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="gold-foil-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cover-bg-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="50%" stop-color="#1b0836"/>
      <stop offset="100%" stop-color="#0b0217"/>
    </linearGradient>
    <pattern id="washi-haunt" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#7c3aed"/>
      <circle cx="10" cy="10" r="3" fill="#facc15"/>
    </pattern>
  </defs>

  <g transform="translate(40, 30)" filter="url(#book-shadow-02)">
    <!-- Back pages peek -->
    <rect x="25" y="8" width="495" height="610" rx="14" fill="#fef3c7" stroke="#000000" stroke-width="2.5"/>
    <rect x="28" y="14" width="492" height="602" rx="12" fill="#ffedd5" stroke="#000000" stroke-width="2"/>

    <!-- Front Hardcover -->
    <rect x="35" y="0" width="490" height="620" rx="16" fill="url(#cover-bg-02)" stroke="#000000" stroke-width="3.5"/>

    <!-- Gold Foil Frame -->
    <rect x="55" y="20" width="450" height="580" rx="12" fill="none" stroke="url(#gold-foil-02)" stroke-width="2.5" stroke-dasharray="8,4" filter="url(#gold-emboss-02)"/>
    <rect x="62" y="27" width="436" height="566" rx="8" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.7"/>

    <!-- Corner Ornaments -->
    <g fill="url(#gold-foil-02)" filter="url(#gold-emboss-02)">
      <polygon points="65,30 85,30 85,34 69,34 69,50 65,50"/>
      <polygon points="495,30 475,30 475,34 491,34 491,50 495,50"/>
      <polygon points="65,590 85,590 85,586 69,586 69,570 65,570"/>
      <polygon points="495,590 475,590 475,586 491,586 491,570 495,570"/>
    </g>

    <!-- Top Washi Tape Strip -->
    <g transform="translate(200, 4) rotate(-3)">
      <rect x="0" y="0" width="160" height="28" rx="4" fill="url(#washi-haunt)" stroke="#000" stroke-width="1.5"/>
      <text x="80" y="19" font-family="'Patrick Hand', cursive" font-size="14" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="1">✦ HAUNTED MANSION ✦</text>
    </g>

    <!-- Center Art: Gothic Haunted Mansion Silhouette -->
    <!-- Full Moon Behind Castle -->
    <circle cx="280" cy="220" r="105" fill="#facc15" stroke="#f59e0b" stroke-width="3" filter="drop-shadow(0 0 25px rgba(250,204,21,0.45))"/>
    <circle cx="260" cy="205" r="95" fill="url(#cover-bg-02)"/>

    <!-- Castle Spire & Silhouette -->
    <g fill="#0b0217" stroke="#3b0764" stroke-width="1.5">
      <!-- Main Spire -->
      <polygon points="280,105 255,160 305,160"/>
      <rect x="260" y="160" width="40" height="150"/>
      <!-- Glowing Spire Window -->
      <path d="M272 185 C272 175 288 175 288 185 L288 205 L272 205 Z" fill="#fde047" stroke="#d97706" stroke-width="1"/>
      <!-- Left Tower -->
      <polygon points="215,145 195,185 235,185"/>
      <rect x="200" y="185" width="30" height="125"/>
      <path d="M210 205 C210 198 220 198 220 205 L220 220 L210 220 Z" fill="#f97316"/>
      <!-- Right Tower -->
      <polygon points="345,145 325,185 365,185"/>
      <rect x="330" y="185" width="30" height="125"/>
      <path d="M340 205 C340 198 350 198 350 205 L350 220 L340 220 Z" fill="#f97316"/>
      <!-- Castle Walls Base -->
      <rect x="180" y="270" width="200" height="45"/>
      <!-- Battlement teeth -->
      <rect x="185" y="260" width="15" height="12"/>
      <rect x="215" y="260" width="15" height="12"/>
      <rect x="245" y="260" width="15" height="12"/>
      <rect x="300" y="260" width="15" height="12"/>
      <rect x="330" y="260" width="15" height="12"/>
      <rect x="360" y="260" width="15" height="12"/>
    </g>

    <!-- Bats Flying Out -->
    <g fill="#fde047">
      <path d="M190 120 Q198 110 205 118 Q212 110 220 120 Q205 125 190 120 Z"/>
      <path d="M330 110 Q336 102 342 108 Q348 102 354 110 Q342 114 330 110 Z" transform="scale(0.8) translate(80, 20)"/>
      <path d="M275 80 Q280 74 285 79 Q290 74 295 80 Q285 83 275 80 Z"/>
    </g>

    <!-- Title Block with Neobrutalism Plaque -->
    <g transform="translate(110, 360)">
      <rect x="0" y="0" width="340" height="110" rx="14" fill="#09090b" stroke="url(#gold-foil-02)" stroke-width="2.5" filter="url(#gold-emboss-02)"/>
      <rect x="6" y="6" width="328" height="98" rx="10" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="170" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="url(#gold-foil-02)" text-anchor="middle" letter-spacing="3">HAUNTED MANSION</text>
      <text x="170" y="66" font-family="'Patrick Hand', cursive" font-size="19" font-weight="800" fill="#fb923c" text-anchor="middle">Sổ Ký Ức Đêm Bí Ngô Neon</text>
      <text x="170" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#c084fc" text-anchor="middle" letter-spacing="1">MEMOUR CRAFT STUDIO • LIMITED EDITION</text>
    </g>

    <!-- Bottom Pumpkin Garden Stickers -->
    <g transform="translate(140, 505)">
      <!-- Jack O Lantern Left -->
      <circle cx="50" cy="40" r="28" fill="#ea580c" stroke="#fff" stroke-width="3"/>
      <circle cx="40" cy="35" r="3.5" fill="#fde047"/>
      <circle cx="60" cy="35" r="3.5" fill="#fde047"/>
      <path d="M40 48 Q50 56 60 48" stroke="#fde047" stroke-width="3" fill="none"/>
      <!-- Ghost Middle -->
      <path d="M140 15 C125 15 115 30 115 50 C115 62 120 62 125 58 C130 62 135 58 140 62 C145 58 150 62 155 58 C160 62 165 50 165 50 C165 30 155 15 140 15 Z" fill="#fff" stroke="#a855f7" stroke-width="2"/>
      <circle cx="134" cy="32" r="2.5" fill="#000"/>
      <circle cx="146" cy="32" r="2.5" fill="#000"/>
      <ellipse cx="140" cy="40" rx="3" ry="4" fill="#f43f5e"/>
      <!-- Jack O Lantern Right -->
      <circle cx="230" cy="40" r="28" fill="#f97316" stroke="#fff" stroke-width="3"/>
      <circle cx="220" cy="35" r="3.5" fill="#fde047"/>
      <circle cx="240" cy="35" r="3.5" fill="#fde047"/>
      <path d="M220 48 Q230 56 240 48" stroke="#fde047" stroke-width="3" fill="none"/>
    </g>

    <!-- Spiral Wire Binding on Left -->
    <g fill="url(#gold-foil-02)" stroke="#000" stroke-width="1.5">
      <ellipse cx="35" cy="60" rx="10" ry="16"/>
      <ellipse cx="35" cy="115" rx="10" ry="16"/>
      <ellipse cx="35" cy="170" rx="10" ry="16"/>
      <ellipse cx="35" cy="225" rx="10" ry="16"/>
      <ellipse cx="35" cy="280" rx="10" ry="16"/>
      <ellipse cx="35" cy="335" rx="10" ry="16"/>
      <ellipse cx="35" cy="390" rx="10" ry="16"/>
      <ellipse cx="35" cy="445" rx="10" ry="16"/>
      <ellipse cx="35" cy="500" rx="10" ry="16"/>
      <ellipse cx="35" cy="555" rx="10" ry="16"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sh-rip" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sh-rip)">
    <!-- Die cut -->
    <path d="M50 85 C50 40 150 40 150 85 L150 180 L50 180 Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
    <!-- Stone -->
    <path d="M54 85 C54 45 146 45 146 85 L146 176 L54 176 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <!-- Crack -->
    <path d="M120 55 L112 70 L118 80 L110 95" stroke="#64748b" stroke-width="2" fill="none"/>
    <!-- RIP text -->
    <text x="100" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#1e293b" text-anchor="middle">R.I.P</text>
    <!-- Little Flower at base -->
    <circle cx="75" cy="165" r="7" fill="#f43f5e"/>
    <circle cx="75" cy="165" r="3" fill="#facc15"/>
    <circle cx="125" cy="165" r="7" fill="#a855f7"/>
    <circle cx="125" cy="165" r="3" fill="#facc15"/>
  </g>
</svg>
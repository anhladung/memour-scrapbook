<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sticker-sh6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sticker-sh6)">
    <!-- White Die-Cut Backing Circle/Cloud -->
    <path d="M 100 10 C 150 10 190 50 190 100 C 190 150 150 190 100 190 C 50 190 10 150 10 100 C 10 50 50 10 100 10 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="8"/>
    
    <!-- Lavender Pastel Background Base -->
    <circle cx="100" cy="100" r="82" fill="#faf5ff"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Spiderweb Radial Spokes -->
    <line x1="100" y1="20" x2="100" y2="180" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="100" x2="180" y2="100" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="42" y1="42" x2="158" y2="158" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="158" y1="42" x2="42" y2="158" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Concentric Web Rings (Curved) -->
    <path d="M 100 75 Q 118 82 125 100 Q 118 118 100 125 Q 82 118 75 100 Q 82 82 100 75 Z" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <path d="M 100 50 Q 135 65 150 100 Q 135 135 100 150 Q 65 135 50 100 Q 65 65 100 50 Z" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <path d="M 100 30 Q 150 50 170 100 Q 150 150 100 170 Q 50 150 30 100 Q 50 50 100 30 Z" fill="none" stroke="#9333ea" stroke-width="2.5"/>

    <!-- Stitched Thread Dangling Spider -->
    <line x1="100" y1="100" x2="135" y2="135" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="3,3"/>
    
    <!-- Cute Button Spider -->
    <g transform="translate(135, 135)">
      <!-- Spider Legs -->
      <path d="M 0 0 Q 15 -10 22 5" fill="none" stroke="#581c87" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 0 Q 18 5 24 18" fill="none" stroke="#581c87" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 0 Q -15 -10 -22 5" fill="none" stroke="#581c87" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 0 Q -18 5 -24 18" fill="none" stroke="#581c87" stroke-width="2.5" stroke-linecap="round"/>

      <circle cx="0" cy="0" r="16" fill="#7e22ce" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="-5" cy="-2" r="4" fill="#facc15"/>
      <circle cx="-4" cy="-3" r="1.5" fill="#000000"/>
      <circle cx="5" cy="-2" r="4" fill="#facc15"/>
      <circle cx="4" cy="-3" r="1.5" fill="#000000"/>
      <!-- Pink Cheeks -->
      <circle cx="-8" cy="4" r="2" fill="#f43f5e"/>
      <circle cx="8" cy="4" r="2" fill="#f43f5e"/>
    </g>

    <!-- Sparkle Stars on Web -->
    <polygon points="55,60 58,66 65,66 60,70 62,77 55,73 48,77 50,70 45,66 52,66" fill="#facc15"/>
    <polygon points="140,50 142,55 147,55 143,58 145,63 140,60 135,63 137,58 133,55 138,55" fill="#4ade80"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sticker-sh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sticker-sh4)" transform="rotate(-15 100 100)">
    <!-- White Die-Cut Border -->
    <path d="M 100 15 C 55 15 20 50 20 95 C 20 135 50 168 90 173 L 90 188 C 90 194 95 198 100 198 C 105 198 110 194 110 188 L 110 173 C 150 168 180 135 180 95 C 180 50 145 15 100 15 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>

    <!-- Lollipop Stick -->
    <rect x="94" y="90" width="12" height="98" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <line x1="97" y1="100" x2="97" y2="180" stroke="#fef9c3" stroke-width="2"/>

    <!-- Giant Swirl Candy Disk -->
    <circle cx="100" cy="95" r="70" fill="#f43f5e"/>
    <!-- Swirl Segments -->
    <path d="M 100 25 A 70 70 0 0 1 170 95 L 100 95 Z" fill="#7c3aed"/>
    <path d="M 170 95 A 70 70 0 0 1 100 165 L 100 95 Z" fill="#ea580c"/>
    <path d="M 100 165 A 70 70 0 0 1 30 95 L 100 95 Z" fill="#facc15"/>
    <path d="M 30 95 A 70 70 0 0 1 100 25 L 100 95 Z" fill="#84cc16"/>

    <!-- Spiral Overlay Rings -->
    <circle cx="100" cy="95" r="48" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="25,12"/>
    <circle cx="100" cy="95" r="28" fill="none" stroke="#f43f5e" stroke-width="8"/>
    <circle cx="100" cy="95" r="14" fill="#facc15" stroke="#ffffff" stroke-width="3"/>

    <!-- Glossy Highlights -->
    <path d="M 50 65 A 60 60 0 0 1 110 38" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Ribbon Bow on Stick -->
    <g transform="translate(100, 150)">
      <path d="M 0 0 L -25 -14 L -25 14 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
      <path d="M 0 0 L 25 -14 L 25 14 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#f472b6" stroke="#9d174d" stroke-width="2"/>
      <path d="M -8 10 L -18 32 L -6 28" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 8 10 L 18 32 L 6 28" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sticker-sh8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sticker-sh8)" transform="rotate(-6 100 100)">
    <!-- White Die-Cut Border -->
    <path d="M 15 155 C 15 135 50 130 80 125 L 85 45 C 85 30 110 15 135 15 C 150 15 160 25 155 40 L 120 125 C 150 130 185 135 185 155 C 185 180 145 185 100 185 C 55 185 15 180 15 155 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Hat Brim (Violet Velvet Cardstock) -->
    <ellipse cx="100" cy="155" rx="82" ry="24" fill="#581c87"/>
    <ellipse cx="100" cy="153" rx="76" ry="20" fill="#6b21a8"/>
    <path d="M 30 155 C 50 170 150 170 170 155" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5,4"/>

    <!-- Pointed Hat Cone (Curving Tip with Star) -->
    <path d="M 60 140 C 75 90 95 45 140 25 C 145 22 152 26 148 34 C 132 55 118 90 140 140 Z" fill="#7c3aed"/>
    <path d="M 75 140 C 85 95 102 55 140 32 C 128 58 116 95 130 140 Z" fill="#6d28d9"/>

    <!-- Washi Tape Ribbon Band (Pumpkin Orange with Polka Dots) -->
    <g transform="translate(68, 126) rotate(2)">
      <path d="M 0 0 C 22 8 46 8 68 0 L 70 18 C 48 24 24 24 0 16 Z" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
      <circle cx="16" cy="9" r="2.5" fill="#fef08a"/>
      <circle cx="34" cy="11" r="2.5" fill="#fef08a"/>
      <circle cx="52" cy="9" r="2.5" fill="#fef08a"/>
    </g>

    <!-- Golden Star Buckle on Band -->
    <polygon points="102,126 106,134 115,134 108,139 111,147 102,142 93,147 96,139 89,134 98,134" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Dangling Golden Star at Hat Tip -->
    <line x1="145" y1="28" x2="160" y2="48" stroke="#ca8a04" stroke-width="2" stroke-dasharray="2,2"/>
    <polygon points="160,45 163,52 170,52 165,56 167,63 160,59 153,63 155,56 150,52 157,52" fill="#facc15"/>

    <!-- Mini Kraft Tag pinned to Hat -->
    <g transform="translate(45, 95) rotate(-25)">
      <rect x="0" y="0" width="44" height="20" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
      <text x="22" y="14" font-family="'Patrick Hand', cursive, sans-serif" font-size="10" font-weight="900" fill="#78350f" text-anchor="middle">SPOOKY</text>
    </g>
  </g>
</svg>

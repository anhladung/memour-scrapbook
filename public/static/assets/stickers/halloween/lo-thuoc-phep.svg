<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sticker-sh7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sticker-sh7)" transform="rotate(-8 100 100)">
    <!-- White Die-Cut Border -->
    <path d="M 75 35 L 75 55 C 75 60 50 85 50 135 C 50 175 75 190 100 190 C 125 190 150 175 150 135 C 150 85 125 60 125 55 L 125 35 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Cork Stopper -->
    <rect x="85" y="16" width="30" height="22" rx="4" fill="#d97706" stroke="#92400e" stroke-width="2.5"/>
    <line x1="90" y1="24" x2="110" y2="24" stroke="#fde68a" stroke-width="2"/>

    <!-- Glass Flask Body -->
    <path d="M 78 38 L 78 58 C 78 62 54 88 54 135 C 54 170 76 184 100 184 C 124 184 146 170 146 135 C 146 88 122 62 122 58 L 122 38 Z" 
          fill="#fdf2f8" stroke="#ec4899" stroke-width="3"/>
    
    <!-- Glowing Slime Green & Magenta Magic Potion -->
    <path d="M 57 125 C 70 120 85 130 100 125 C 115 120 130 130 143 125 C 143 162 124 180 100 180 C 76 180 57 162 57 125 Z" 
          fill="#ec4899"/>
    <!-- Floating Green Magic Slime Core -->
    <path d="M 64 140 C 78 135 90 144 102 140 C 114 136 126 144 136 140 C 136 166 120 176 100 176 C 80 176 64 166 64 140 Z" 
          fill="#84cc16"/>
    
    <!-- Bubbles Rising in Potion -->
    <circle cx="85" cy="110" r="7" fill="#bef264" stroke="#4d7c0f" stroke-width="1.5"/>
    <circle cx="83" cy="108" r="2" fill="#ffffff"/>
    <circle cx="115" cy="98" r="5" fill="#f472b6" stroke="#9d174d" stroke-width="1.2"/>
    <circle cx="100" cy="78" r="4" fill="#bef264"/>

    <!-- Glass Specular Reflection -->
    <path d="M 66 105 C 64 125 64 150 72 165" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Scrapbook Paper Label: "MEMOUR MAGIC" -->
    <g transform="translate(68, 126)">
      <rect x="0" y="0" width="64" height="28" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <rect x="3" y="3" width="58" height="22" rx="2" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="32" y="17" font-family="'Patrick Hand', cursive, sans-serif" font-size="11" font-weight="900" fill="#713f12" text-anchor="middle">✦ MAGIC ✦</text>
    </g>
  </g>
</svg>

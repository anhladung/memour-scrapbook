name: Build static Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-static-tailwind.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create temporary Tailwind build files
        run: |
          cat > .tailwind-input.css <<'CSS'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          CSS

          cat > .tailwind-build.config.js <<'JS'
          module.exports = {
            content: [
              "./templates/**/*.html",
              "./static/js/**/*.js",
              "./app.py"
            ],
            theme: {
              extend: {
                colors: {
                  craft: {
                    cream: "#fdfbf7",
                    ivory: "#fbf8f2",
                    beige: "#e8d8c3",
                    kraft: "#d97706",
                    brown: "#78350f",
                    darkbrown: "#29180c",
                    burgundy: "#881337",
                    wine: "#9f1239",
                    dustypink: "#db2777",
                    softpink: "#f472b6",
                    mutedorange: "#ea580c",
                    yellow: "#fde047",
                    softyellow: "#fef08a"
                  }
                },
                fontFamily: {
                  sans: ['"Be Vietnam Pro"', "sans-serif"],
                  heading: ['"Plus Jakarta Sans"', '"Be Vietnam Pro"', "sans-serif"],
                  hand: ['"Patrick Hand"', "cursive", "sans-serif"]
                }
              }
            },
            plugins: []
          };
          JS

      - name: Compile Tailwind
        run: |
          npx --yes tailwindcss@3.4.17 -c .tailwind-build.config.js -i .tailwind-input.css -o static/css/tailwind.min.css --minify

      - name: Replace CDN runtime with static CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("templates/base.html")
          text = path.read_text(encoding="utf-8")

          text = text.replace('  <link rel="preconnect" href="https://cdn.tailwindcss.com">\n', '')
          text = text.replace('  <script src="https://cdn.tailwindcss.com"></script>\n', '')

          text = re.sub(
              r'\n  <script>\n    tailwind\.config = \{.*?\n  </script>\n',
              '\n',
              text,
              flags=re.S,
          )

          custom_css = '  <link rel="stylesheet" href="/static/css/style.css">'
          static_tailwind = '  <link rel="stylesheet" href="/static/css/tailwind.min.css">\n' + custom_css
          if '/static/css/tailwind.min.css' not in text:
              text = text.replace(custom_css, static_tailwind)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify build coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path("static/css/tailwind.min.css").read_text(encoding="utf-8")
          base = Path("templates/base.html").read_text(encoding="utf-8")

          assert len(css) > 20000, f"Tailwind CSS unexpectedly small: {len(css)}"
          for selector in [".bg-rose-800", ".rounded-3xl", ".grid", ".sm\\:flex-none", ".lg\\:grid-cols-12"]:
              assert selector in css, f"Missing expected selector: {selector}"
          assert "cdn.tailwindcss.com" not in base, "Tailwind CDN still present"
          assert "/static/css/tailwind.min.css" in base, "Static Tailwind stylesheet not linked"
          print(f"Built static Tailwind CSS: {len(css)} bytes")
          PY

      - name: Clean temporary files and commit
        run: |
          rm .tailwind-input.css .tailwind-build.config.js
          rm .github/workflows/build-static-tailwind.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Tailwind CDN with static CSS [skip ci]"
          git push

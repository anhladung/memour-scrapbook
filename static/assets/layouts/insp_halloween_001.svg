<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" fill="none">
  <defs>
    <filter id="inspSh-1"><feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
    <linearGradient id="bg-hw-01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180d2b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
  </defs>
  <!-- Background canvas -->
  <rect width="600" height="450" fill="#fdfbf7"/>
  <!-- Opened Scrapbook Spread -->
  <rect x="30" y="25" width="540" height="400" rx="18" fill="url(#bg-hw-01)" stroke="#000" stroke-width="3" filter="url(#inspSh-1)"/>
  <!-- Stitched page border -->
  <rect x="45" y="40" width="510" height="370" rx="14" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Center Book Spine Gutter -->
  <line x1="300" y1="25" x2="300" y2="425" stroke="#000" stroke-width="3"/>
  <line x1="300" y1="40" x2="300" y2="410" stroke="#a855f7" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Left Page: Polaroid Frame & Jack O Lantern -->
  <g transform="translate(65, 65) rotate(-4 100 130)" filter="url(#inspSh-1)">
    <rect width="180" height="230" rx="10" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <rect x="12" y="12" width="156" height="150" rx="6" fill="#09090b"/>
    <circle cx="90" cy="85" r="45" fill="#ea580c"/>
    <polygon points="90,70 82,82 98,82" fill="#facc15"/>
    <path d="M75 105 Q90 120 105 105" stroke="#facc15" stroke-width="3" fill="none"/>
    <text x="90" y="195" font-family="'Patrick Hand', cursive" font-size="16" fill="#ea580c" text-anchor="middle">Spooky Night 🎃</text>
  </g>

  <!-- Right Page: Filmstrip 3 Photos -->
  <g transform="translate(325, 75) rotate(3 110 110)" filter="url(#inspSh-1)">
    <rect width="210" height="130" rx="8" fill="#09090b" stroke="#000" stroke-width="2"/>
    <rect x="15" y="20" width="55" height="90" rx="4" fill="#a855f7"/>
    <rect x="78" y="20" width="55" height="90" rx="4" fill="#f97316"/>
    <rect x="140" y="20" width="55" height="90" rx="4" fill="#84cc16"/>
  </g>

  <!-- Washi tape and Sticker Accents -->
  <g transform="translate(350, 235)">
    <!-- Washi tape note -->
    <rect x="0" y="0" width="170" height="60" rx="6" fill="#fef08a" stroke="#000" stroke-width="2" transform="rotate(-2)"/>
    <text x="85" y="36" font-family="'Patrick Hand', cursive" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Vũ Hội Hóa Trang 2026</text>
  </g>

  <!-- Cute Ghost Sticker -->
  <g transform="translate(240, 280) scale(0.8)">
    <path d="M50 20 C30 20 20 40 20 70 C20 85 28 85 35 80 C42 85 50 80 58 85 C65 80 72 85 80 70 C80 40 70 20 50 20 Z" fill="#fff" stroke="#000" stroke-width="3"/>
    <circle cx="42" cy="45" r="4" fill="#000"/>
    <circle cx="58" cy="45" r="4" fill="#000"/>
    <ellipse cx="50" cy="55" rx="4" ry="6" fill="#f43f5e"/>
  </g>
</svg>
    <circle cx="92" cy="76" r="22" fill="#1e1035"/>
    <path d="M100 50 Q102 55 106 56 Q102 57 100 62 Q98 57 94 56 Q98 55 100 50 Z" fill="#fde047"/>
    <text x="100" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#fde047" text-anchor="middle" letter-spacing="1.5">XVIII • THE MOON</text>
  </g>
</svg>
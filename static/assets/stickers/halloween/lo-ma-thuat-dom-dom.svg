<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sh-jar" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sh-jar)">
    <!-- Die cut -->
    <rect x="55" y="45" width="90" height="135" rx="20" fill="#fff" stroke="#fff" stroke-width="12"/>
    <rect x="70" y="25" width="60" height="25" rx="5" fill="#fff" stroke="#fff" stroke-width="10"/>
    <!-- Cork Lid -->
    <rect x="72" y="28" width="56" height="20" rx="4" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <!-- Jar glass -->
    <rect x="60" y="50" width="80" height="125" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
    <!-- Firefly Orbs glowing -->
    <circle cx="85" cy="90" r="8" fill="#fde047" filter="drop-shadow(0 0 6px #facc15)"/>
    <circle cx="115" cy="110" r="10" fill="#a3e635" filter="drop-shadow(0 0 8px #84cc16)"/>
    <circle cx="85" cy="140" r="7" fill="#38bdf8" filter="drop-shadow(0 0 6px #0ea5e9)"/>
    <!-- Tag hanging -->
    <path d="M100 50 L115 75" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="105" y="70" width="26" height="16" rx="3" fill="#ea580c"/>
    <text x="118" y="82" font-family="'Patrick Hand', cursive" font-size="9" fill="#fff" text-anchor="middle">BOO</text>
  </g>
</svg>
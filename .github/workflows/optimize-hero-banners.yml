name: Optimize hero banners

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-hero-banners.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WebP encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert hero banners
        run: |
          set -e
          for file in static/assets/banners/hero_banner_01.jpg static/assets/banners/hero_banner_02.jpg static/assets/banners/hero_banner_03.jpg static/assets/banners/hero_banner_04.jpg; do
            out="${file%.jpg}.webp"
            cwebp -quiet -q 84 -m 6 "$file" -o "$out"
          done

      - name: Point hero UI to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path("templates/index.html"), Path("templates/components/carousel.html")]:
              text = path.read_text(encoding="utf-8")
              for i in range(1, 5):
                  text = text.replace(f"/static/assets/banners/hero_banner_0{i}.jpg", f"/static/assets/banners/hero_banner_0{i}.webp")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify WebP files
        run: |
          test -s static/assets/banners/hero_banner_01.webp
          test -s static/assets/banners/hero_banner_02.webp
          test -s static/assets/banners/hero_banner_03.webp
          test -s static/assets/banners/hero_banner_04.webp
          grep -q "hero_banner_01.webp" templates/index.html
          grep -q "hero_banner_04.webp" templates/components/carousel.html

      - name: Commit optimized assets and remove temporary workflow
        run: |
          rm .github/workflows/optimize-hero-banners.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize hero banners to WebP [skip ci]"
          git push

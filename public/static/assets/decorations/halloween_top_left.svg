<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" fill="none">
  <defs>
    <!-- Drop Shadows for Die-Cut Scrapbook Stickers -->
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f0c29" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Washi Tape Patterns -->
    <pattern id="polka-orange" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fb923c"/>
      <circle cx="4" cy="4" r="2.5" fill="#7c2d12"/>
      <circle cx="12" cy="12" r="2.5" fill="#7c2d12"/>
      <circle cx="12" cy="4" r="1.5" fill="#fed7aa"/>
      <circle cx="4" cy="12" r="1.5" fill="#fed7aa"/>
    </pattern>
    <pattern id="chevron-lime" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#84cc16"/>
      <path d="M0 7 L7 0 L14 7 L7 14 Z" fill="#4d7c0f" opacity="0.35"/>
      <circle cx="7" cy="7" r="1.8" fill="#ecfccb"/>
    </pattern>
  </defs>

  <!-- 1. SPIDERWEB STITCHED CORNER (Embroidery Thread Scrapbook Style) -->
  <g opacity="0.85" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3">
    <!-- Web Radial Ribs -->
    <line x1="0" y1="0" x2="160" y2="35"/>
    <line x1="0" y1="0" x2="135" y2="85"/>
    <line x1="0" y1="0" x2="85" y2="135"/>
    <line x1="0" y1="0" x2="35" y2="160"/>
    
    <!-- Web Concentric Spirals -->
    <path d="M45 10 Q35 35 10 45" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <path d="M90 20 Q70 70 20 90" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <path d="M135 30 Q105 105 30 135" fill="none" stroke="#c084fc" stroke-width="1.6"/>
  </g>

  <!-- 2. WASHI TAPE STRIP #1 (Torn Edge, Orange Polka Dots) -->
  <g transform="translate(10, 45) rotate(-18)" filter="url(#sticker-shadow)">
    <!-- Washi Tape Body with jagged torn sides -->
    <path d="M 0 0 L 140 0 L 138 28 L 140 32 L 137 36 L 0 36 L 3 24 L 0 12 Z" 
          fill="url(#polka-orange)" opacity="0.94" stroke="#c2410c" stroke-width="1.2"/>
    <!-- Stitch Line on Tape -->
    <line x1="12" y1="18" x2="128" y2="18" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- 3. WASHI TAPE STRIP #2 (Slime Green Chevron, Pinned Across) -->
  <g transform="translate(50, -5) rotate(32)" filter="url(#sticker-shadow)">
    <path d="M 0 0 L 110 0 L 108 24 L 110 28 L 0 28 L 3 14 Z" 
          fill="url(#chevron-lime)" opacity="0.92" stroke="#3f6212" stroke-width="1.2"/>
  </g>

  <!-- 4. DANGLING SCRAPBOOK SPIDER WITH THREAD -->
  <!-- Stitched Thread -->
  <line x1="68" y1="30" x2="72" y2="175" stroke="#f472b6" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Dangling Spider (Cute Button Craft Style) -->
  <g transform="translate(52, 175)" filter="url(#sticker-shadow)">
    <!-- Spider Legs -->
    <path d="M 10 18 Q -4 10 -12 18" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 10 22 Q -6 24 -14 32" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 30 18 Q 44 10 52 18" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 30 22 Q 46 24 54 32" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- White Die-Cut Outline -->
    <ellipse cx="20" cy="22" rx="17" ry="15" fill="#ffffff"/>
    <!-- Spider Body (Plum Violet) -->
    <ellipse cx="20" cy="22" rx="14" ry="12" fill="#581c87"/>
    <!-- Cute Eyes -->
    <circle cx="16" cy="20" r="3.5" fill="#ffffff"/>
    <circle cx="16" cy="20" r="1.8" fill="#09090b"/>
    <circle cx="17.2" cy="19" r="0.8" fill="#ffffff"/>
    
    <circle cx="24" cy="20" r="3.5" fill="#ffffff"/>
    <circle cx="24" cy="20" r="1.8" fill="#09090b"/>
    <circle cx="25.2" cy="19" r="0.8" fill="#ffffff"/>
    
    <!-- Cheeks & Bowtie -->
    <circle cx="12" cy="24" r="1.5" fill="#f43f5e"/>
    <circle cx="28" cy="24" r="1.5" fill="#f43f5e"/>
    <!-- Tiny Orange Bowtie -->
    <path d="M 16 32 L 20 29 L 24 32 L 20 30 Z" fill="#f97316"/>
  </g>

  <!-- 5. MAIN STICKER: HIPSTER JACK-O'-LANTERN WITH ROUND GLASSES (Scrapbook Die-Cut) -->
  <g transform="translate(55, 60)" filter="url(#sticker-shadow)">
    <!-- White Die-cut thick sticker border -->
    <path d="M 40 18 C 20 18 6 36 6 62 C 6 88 20 106 45 106 C 52 106 58 104 65 100 C 72 104 78 106 85 106 C 110 106 124 88 124 62 C 124 36 110 18 90 18 C 82 18 74 22 65 26 C 56 22 48 18 40 18 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>

    <!-- Pumpkin Stem (Kraft Green with stitch) -->
    <path d="M 62 8 C 60 -2 68 -6 74 -3 C 71 5 69 12 68 20 Z" fill="#65a30d" stroke="#365314" stroke-width="1.5"/>
    
    <!-- Pumpkin Ribs (Vibrant Sunset Orange Gradient) -->
    <path d="M 65 24 C 45 24 25 38 25 64 C 25 90 45 102 65 102 C 85 102 105 90 105 64 C 105 38 85 24 65 24 Z" fill="#ea580c"/>
    <path d="M 42 28 C 24 34 14 48 14 64 C 14 84 26 98 42 98 C 48 98 52 92 54 84 C 42 78 38 60 42 28 Z" fill="#f97316"/>
    <path d="M 88 28 C 106 34 116 48 116 64 C 116 84 104 98 88 98 C 82 98 78 92 76 84 C 88 78 92 60 88 28 Z" fill="#fb923c"/>
    
    <!-- Pumpkin Texture Highlights -->
    <path d="M 28 42 Q 22 62 28 80" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Glowing Carved Mouth (Happy Gen-Z Smile) -->
    <path d="M 45 74 Q 65 92 85 74 Q 78 86 65 86 Q 52 86 45 74 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <polygon points="56,76 60,82 64,77" fill="#ea580c"/>
    
    <!-- Geek/Hipster Round Glasses (Die-cut Scrapbook look) -->
    <g transform="translate(0, 0)">
      <!-- Left Lens Frame -->
      <circle cx="48" cy="54" r="14" fill="#09090b" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="48" cy="54" r="11" fill="#fef08a"/>
      <!-- Glowing Eye inside -->
      <polygon points="48,47 43,56 53,56" fill="#b45309"/>
      
      <!-- Right Lens Frame -->
      <circle cx="82" cy="54" r="14" fill="#09090b" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="82" cy="54" r="11" fill="#fef08a"/>
      <!-- Glowing Eye inside -->
      <polygon points="82,47 77,56 87,56" fill="#b45309"/>

      <!-- Bridge -->
      <path d="M 62 52 Q 65 48 68 52" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <!-- Eyewear Highlights -->
      <ellipse cx="44" cy="50" rx="3" ry="1.5" fill="#ffffff" transform="rotate(-30 44 50)"/>
      <ellipse cx="78" cy="50" rx="3" ry="1.5" fill="#ffffff" transform="rotate(-30 78 50)"/>
    </g>

    <!-- Mini Sticker Tag "SPOOKY" on Pumpkin -->
    <g transform="translate(70, 84) rotate(-12)">
      <rect x="0" y="0" width="46" height="16" rx="4" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
      <text x="23" y="11.5" font-family="'Patrick Hand', 'Comic Sans MS', cursive, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">✦ SPOOKY ✦</text>
    </g>
  </g>

  <!-- 6. ORIGAMI FOLDED PAPER BAT -->
  <g transform="translate(180, 22) rotate(15)" filter="url(#sticker-shadow)">
    <!-- White Sticker Outline -->
    <path d="M 0 15 L 20 0 L 26 12 L 34 2 L 42 12 L 48 0 L 68 15 L 56 34 L 34 26 L 12 34 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <!-- Folded Paper Wings (Dark Violet with fold lines) -->
    <path d="M 2 16 L 20 2 L 26 13 L 34 4 L 42 13 L 48 2 L 66 16 L 54 32 L 34 25 L 14 32 Z" fill="#6b21a8"/>
    <!-- Fold Highlights -->
    <line x1="34" y1="4" x2="34" y2="25" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="20" y1="2" x2="26" y2="13" stroke="#c084fc" stroke-width="1"/>
    <line x1="48" y1="2" x2="42" y2="13" stroke="#c084fc" stroke-width="1"/>
    <!-- Cute Kawaii Eyes -->
    <circle cx="31" cy="14" r="1.8" fill="#facc15"/>
    <circle cx="37" cy="14" r="1.8" fill="#facc15"/>
  </g>

  <!-- 7. SPARKLES & CANDY CORN ACCENTS -->
  <!-- Candy Corn Sticker -->
  <g transform="translate(160, 95) rotate(-22)" filter="url(#sticker-shadow)">
    <path d="M 12 0 C 14 0 18 10 22 22 C 16 25 8 25 2 22 C 6 10 10 0 12 0 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3"/>
    <path d="M 12 0 L 16 8 L 8 8 Z" fill="#ffffff"/>
    <path d="M 8 8 L 16 8 L 19 16 L 5 16 Z" fill="#f97316"/>
    <path d="M 5 16 L 19 16 C 16 22 8 22 5 16 Z" fill="#facc15"/>
  </g>
  <!-- 8. HALLOWEEN 2026 NEO-BRUTALISM BADGE -->
  <g transform="translate(145, 120) rotate(10)" filter="url(#sticker-shadow)">
    <rect x="0" y="0" width="135" height="34" rx="17" fill="#facc15" stroke="#18181b" stroke-width="2.5"/>
    <rect x="3" y="3" width="129" height="28" rx="14" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="67" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#18181b" text-anchor="middle" letter-spacing="1">✦ 2026 SPOOKY ✦</text>
  </g>
</svg>

    <rect x="72" y="75" width="56" height="90" rx="6" fill="#a855f7"/>
    <text x="100" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#fde047" text-anchor="middle">GHOST</text>
    <text x="100" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#fff" text-anchor="middle">MILK</text>
    <!-- Cute Ghost drawing -->

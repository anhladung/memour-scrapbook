      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sh-tarot)" transform="rotate(4 100 100)">
    <!-- Die cut -->
    <rect x="45" y="20" width="110" height="160" rx="10" fill="#fff" stroke="#fff" stroke-width="12"/>

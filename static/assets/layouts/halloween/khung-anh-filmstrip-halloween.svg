    <!-- 3 Photo Apertures -->
    <!-- Frame 1 -->
    <rect x="25" y="48" width="145" height="204" rx="6" fill="#181126" stroke="#ea580c" stroke-width="2"/>
    <text x="97" y="145" font-family="'Patrick Hand', cursive" font-size="14" fill="#fb923c" text-anchor="middle">ẢNH TIỆC 01</text>
    <circle cx="97" cy="165" r="14" fill="#a855f7" opacity="0.4"/>
    <path d="M97 156 Q100 160 104 161 Q100 162 97 166 Q94 162 90 161 Q94 160 97 156 Z" fill="#facc15"/>

    <!-- Frame 2 -->
    <rect x="182" y="48" width="145" height="204" rx="6" fill="#181126" stroke="#a855f7" stroke-width="2"/>
    <text x="254" y="145" font-family="'Patrick Hand', cursive" font-size="14" fill="#c084fc" text-anchor="middle">ẢNH HÓA TRANG 02</text>
    <circle cx="254" cy="165" r="14" fill="#ea580c" opacity="0.4"/>
    <path d="M254 156 Q257 160 261 161 Q257 162 254 166 Q251 162 247 161 Q251 160 254 156 Z" fill="#fde047"/>


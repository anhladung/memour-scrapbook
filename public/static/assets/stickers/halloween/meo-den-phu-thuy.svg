      <path d="M -24 -2 Q 0 -36 10 -58 Q 5 -36 24 -2 Z" fill="#6d28d9"/>
      <path d="M -20 -6 Q 0 -10 20 -6 L 21 0 Q 0 -4 -19 0 Z" fill="#f97316"/>
      <polygon points="0,-9 3,-6 7,-6 4,-3 5,1 1,-2 -3,1 -2,-3 -5,-6 -1,-6" fill="#facc15"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" fill="none">
  <defs>
    <!-- Hardcover Scrapbook 3D Bevel & Shadow -->
    <filter id="book-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#9333ea" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#ea580c" flood-opacity="0.15"/>
    </filter>
    <filter id="gold-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Deep Mystical Purple Cover Gradient -->
    <linearGradient id="cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#120724"/>
      <stop offset="100%" stop-color="#090314"/>
    </linearGradient>

    <!-- Washi Pattern -->
    <pattern id="washi-bat" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ea580c"/>
      <path d="M10 6 L4 10 L16 10 Z" fill="#431407"/>
      <circle cx="10" cy="14" r="1.5" fill="#fef08a"/>
    </pattern>
  </defs>

  <g transform="translate(40, 30)" filter="url(#book-shadow)">
    <!-- BACK PAGES ACCORDION EFFECT (Paper Sheets Peek) -->
    <rect x="25" y="8" width="495" height="610" rx="14" fill="#f5ede0" stroke="#000000" stroke-width="2.5"/>
    <rect x="28" y="14" width="492" height="602" rx="12" fill="#eae0d0" stroke="#000000" stroke-width="2"/>

    <!-- FRONT HARDCOVER BODY -->
    <rect x="35" y="0" width="490" height="620" rx="16" fill="url(#cover-bg)" stroke="#000000" stroke-width="3.5"/>

    <!-- EMBOSSED GOLD FOIL DECORATIVE FRAME -->
    <rect x="55" y="20" width="450" height="580" rx="12" fill="none" stroke="url(#gold-foil)" stroke-width="2" stroke-dasharray="8,4" filter="url(#gold-emboss)"/>
    <rect x="62" y="27" width="436" height="566" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.6"/>

    <!-- CORNER GOLD ORNAMENTS -->
    <g fill="url(#gold-foil)" filter="url(#gold-emboss)">
      <!-- Top Left -->
      <polygon points="65,30 85,30 85,34 69,34 69,50 65,50"/>
      <!-- Top Right -->
      <polygon points="495,30 475,30 475,34 491,34 491,50 495,50"/>
      <!-- Bottom Left -->
      <polygon points="65,590 85,590 85,586 69,586 69,570 65,570"/>
      <!-- Bottom Right -->
      <polygon points="495,590 475,590 475,586 491,586 491,570 495,570"/>
    </g>

    <!-- EMBOSSED CENTRAL MOTIF: GIANT HALLOWEEN MOON & HAUNTED CASTLE -->
    <g transform="translate(180, 80)">
      <!-- Radiant Halo -->
      <circle cx="100" cy="100" r="95" fill="#fde047" opacity="0.15"/>
      <!-- Big Golden Harvest Moon -->
      <circle cx="100" cy="100" r="85" fill="url(#gold-foil)" stroke="#000000" stroke-width="2.5" filter="url(#gold-emboss)"/>
      
      <!-- Castle Silhouette in Black -->
      <path d="M40 185 L40 120 L50 120 L50 130 L60 130 L60 110 L75 110 L75 185 Z" fill="#120724"/>
      <path d="M125 185 L125 105 L135 90 L145 105 L145 185 Z" fill="#120724"/>
      <path d="M85 185 L85 95 L95 80 L105 80 L115 95 L115 185 Z" fill="#120724"/>
      <!-- Glowing Yellow Windows -->
      <rect x="95" y="115" width="10" height="15" rx="3" fill="#fef08a"/>
      <rect x="63" y="140" width="8" height="12" rx="2" fill="#fef08a"/>
      <rect x="130" y="130" width="8" height="12" rx="2" fill="#fef08a"/>
    </g>

    <!-- FLYING DIE-CUT BATS -->
    <g fill="url(#gold-foil)" filter="url(#gold-emboss)">
      <!-- Bat 1 -->
      <polygon points="120,130 95,115 102,138 85,135 98,150 110,147 120,160 130,147 142,150 155,135 138,138 145,115" transform="scale(0.8) translate(30, 20)"/>
      <!-- Bat 2 -->
      <polygon points="410,120 390,108 396,126 380,124 390,136 400,133 410,144 420,133 430,136 440,124 424,126 430,108" transform="scale(0.65) translate(180, 20)"/>
    </g>

    <!-- TITLE BANNER PLATE (Foil Stamped & Embossed) -->
    <g transform="translate(90, 310)">
      <!-- Banner Box -->
      <rect x="0" y="0" width="380" height="120" rx="14" fill="#1a0b2e" stroke="url(#gold-foil)" stroke-width="2.5" filter="url(#book-shadow)"/>
      <rect x="6" y="6" width="368" height="108" rx="10" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="4,3"/>

      <!-- Stamped Header -->
      <text x="190" y="38" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#facc15" text-anchor="middle" letter-spacing="3">
        ✦ MEMOUR SCRAPBOOK 2026 ✦
      </text>

      <!-- Main Stamped Slogan -->
      <text x="190" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        HALLOWEEN NIGHT
      </text>
      
      <!-- Subtitle -->
      <text x="190" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ea580c" text-anchor="middle" letter-spacing="2">
        SỔ THỦ CÔNG KỶ NIỆM MA QUÁI
      </text>
    </g>

    <!-- LOWER SECTION: EMBOSSED JACK-O'-LANTERN & POTION BOTTLE -->
    <g transform="translate(190, 455)">
      <!-- Giant Jack O Lantern -->
      <ellipse cx="90" cy="55" rx="55" ry="46" fill="#ea580c" stroke="#000000" stroke-width="2.5"/>
      <ellipse cx="65" cy="55" rx="35" ry="42" fill="#f97316"/>
      <ellipse cx="115" cy="55" rx="35" ry="42" fill="#f97316"/>
      <ellipse cx="90" cy="55" rx="22" ry="40" fill="#fb923c"/>
      <!-- Pumpkin Stem -->
      <path d="M85 15 C88 0 102 -2 105 -5 C98 8 96 15 94 18 Z" fill="#65a30d" stroke="#000000" stroke-width="2"/>
      <!-- Carved Face Glowing -->
      <polygon points="70,45 80,55 62,55" fill="#fef08a" stroke="#000000" stroke-width="1.5"/>
      <polygon points="110,45 118,55 100,55" fill="#fef08a" stroke="#000000" stroke-width="1.5"/>
      <polygon points="90,58 95,65 85,65" fill="#fef08a"/>
      <path d="M66,68 Q90,90 114,68 Q106,78 100,74 Q94,80 90,74 Q82,78 66,68 Z" fill="#fef08a" stroke="#000000" stroke-width="1.8"/>
    </g>

    <!-- RED/PURPLE WAX SEAL EMBLEM ON BOTTOM RIGHT -->
    <g transform="translate(420, 500)">
      <circle cx="35" cy="35" r="34" fill="#831843" stroke="#000000" stroke-width="2.5"/>
      <circle cx="35" cy="35" r="28" fill="#9d174d" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="35" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#fde047" text-anchor="middle">
        MEMOUR
      </text>
      <text x="35" y="47" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">
        SEALED
      </text>
    </g>

    <!-- LEFT SPINE BINDING RINGS (Vintage Metal Spiral Binding) -->
    <g transform="translate(15, 0)">
      <!-- Spine Backplate -->
      <rect x="10" y="5" width="20" height="610" rx="6" fill="#0f071a" stroke="#000000" stroke-width="2.5"/>
      <!-- 12 Spiral Rings -->
      <g stroke="#000000" stroke-width="3">
        {% for r in range(12) %}
        {% endfor %}
        <ellipse cx="20" cy="50" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="100" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="150" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="200" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="250" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="300" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="350" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="400" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="450" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="500" rx="16" ry="7" fill="url(#gold-foil)"/>
        <ellipse cx="20" cy="550" rx="16" ry="7" fill="url(#gold-foil)"/>
      </g>
    </g>

    <!-- TOP WASHI TAPE STRIP -->
    <g transform="translate(200, -12) rotate(-3)" filter="url(#book-shadow)">
      <polygon points="0,0 140,0 136,26 140,30 0,30 3,15" fill="url(#washi-bat)" stroke="#000000" stroke-width="1.5"/>
    </g>
  </g>
</svg>

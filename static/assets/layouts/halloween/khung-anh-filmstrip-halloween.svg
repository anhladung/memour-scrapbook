      <rect x="90" y="266" width="16" height="24" rx="4"/>
      <rect x="125" y="266" width="16" height="24" rx="4"/>
      <rect x="160" y="266" width="16" height="24" rx="4"/>
      <rect x="195" y="266" width="16" height="24" rx="4"/>
      <rect x="230" y="266" width="16" height="24" rx="4"/>
      <rect x="265" y="266" width="16" height="24" rx="4"/>
      <rect x="300" y="266" width="16" height="24" rx="4"/>
      <rect x="335" y="266" width="16" height="24" rx="4"/>
      <rect x="370" y="266" width="16" height="24" rx="4"/>
      <rect x="405" y="266" width="16" height="24" rx="4"/>
      <rect x="440" y="266" width="16" height="24" rx="4"/>

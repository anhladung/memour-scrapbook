<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sticker-sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sticker-sh3)">
    <!-- White Die-Cut Border -->
    <path d="M 40 120 C 25 120 15 130 15 150 C 15 175 35 190 100 190 C 165 190 185 175 185 150 C 185 130 175 120 160 120 L 155 85 C 155 70 145 60 135 55 L 155 10 C 158 2 148 -4 140 3 L 115 28 L 85 3 C 77 -4 67 2 70 10 L 90 55 C 80 60 70 70 70 85 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>

    <!-- Cauldron Body -->
    <ellipse cx="100" cy="155" rx="72" ry="32" fill="#3b0764"/>
    <ellipse cx="100" cy="128" rx="68" ry="12" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <!-- Neon Slime Potion -->
    <ellipse cx="100" cy="127" rx="60" ry="10" fill="#84cc16"/>
    <ellipse cx="98" cy="126" rx="52" ry="7" fill="#bef264"/>
    <!-- Bubbles -->
    <circle cx="68" cy="120" r="9" fill="#a3e635" stroke="#365314" stroke-width="1.5"/>
    <circle cx="132" cy="116" r="11" fill="#bef264" stroke="#365314" stroke-width="1.5"/>

    <!-- Black Cat Head -->
    <ellipse cx="100" cy="85" rx="38" ry="32" fill="#18181b"/>
    <!-- Cat Ears -->
    <polygon points="68,68 76,32 94,58" fill="#18181b"/>
    <polygon points="72,64 78,38 90,58" fill="#f472b6"/>
    <polygon points="132,68 124,32 106,58" fill="#18181b"/>
    <polygon points="128,64 122,38 110,58" fill="#f472b6"/>

    <!-- Golden Anime Eyes -->
    <ellipse cx="86" cy="82" rx="8" ry="10" fill="#facc15"/>
    <ellipse cx="86" cy="82" rx="3.5" ry="8.5" fill="#09090b"/>
    <circle cx="89" cy="78" r="3" fill="#ffffff"/>

    <ellipse cx="114" cy="82" rx="8" ry="10" fill="#facc15"/>
    <ellipse cx="114" cy="82" rx="3.5" ry="8.5" fill="#09090b"/>
    <circle cx="117" cy="78" r="3" fill="#ffffff"/>

    <!-- Pink Nose & Whiskers -->
    <polygon points="100,92 97,96 103,96" fill="#fda4af"/>
    <line x1="72" y1="92" x2="56" y2="90" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="72" y1="96" x2="58" y2="100" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="128" y1="92" x2="144" y2="90" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="128" y1="96" x2="142" y2="100" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>


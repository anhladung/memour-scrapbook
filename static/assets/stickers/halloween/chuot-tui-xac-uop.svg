    <circle cx="84" cy="104" r="7" fill="#facc15"/>
    <circle cx="85" cy="104" r="3" fill="#000"/>
    <circle cx="116" cy="104" r="7" fill="#facc15"/>
    <circle cx="115" cy="104" r="3" fill="#000"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <!-- 3D Shadow for Polaroid Frame -->
    <filter id="frame-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>
    <filter id="sticker-pop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <pattern id="washi-purple-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#7c3aed"/>
      <circle cx="4" cy="4" r="2.5" fill="#facc15"/>
      <circle cx="12" cy="12" r="2.5" fill="#facc15"/>
    </pattern>
    <pattern id="washi-orange-stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#ea580c"/>
      <rect x="0" y="0" width="8" height="16" fill="#fb923c"/>
    </pattern>
  </defs>

  <!-- BACKGROUND AMBIENT GLOW -->
  <circle cx="300" cy="300" r="240" fill="#a855f7" opacity="0.08" filter="blur(40px)"/>

  <!-- POLAROID CARD BODY (Rotated slightly for handmade feel) -->
  <g transform="translate(60, 40) rotate(-2 240 260)" filter="url(#frame-shadow)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="480" height="520" rx="16" fill="#fefdfa" stroke="#000000" stroke-width="3"/>
    
    <!-- Stitched Inner Border -->
    <rect x="14" y="14" width="452" height="492" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- INNER PHOTO APERTURE (Midnight Halloween Sky) -->
    <rect x="35" y="35" width="410" height="380" rx="10" fill="#181126" stroke="#000000" stroke-width="2.5"/>
    
    <!-- Photo Window Background Details: Full Moon & Stars -->
    <circle cx="370" cy="110" r="55" fill="#fde047" stroke="#facc15" stroke-width="3"/>
    <circle cx="355" cy="100" r="50" fill="#181126"/> <!-- Moon Crater Crescent -->
    
    <!-- Stars / Sparkles in Photo Area -->
    <g fill="#facc15">
      <path d="M120 90 Q125 100 135 105 Q125 110 120 120 Q115 110 105 105 Q115 100 120 90 Z"/>
      <path d="M230 70 Q233 77 240 80 Q233 83 230 90 Q227 83 220 80 Q227 77 230 70 Z" transform="scale(0.8) translate(80, 20)"/>
      <circle cx="180" cy="140" r="2.5"/>
      <circle cx="280" cy="160" r="3"/>
      <circle cx="90" cy="220" r="2"/>
    </g>

    <!-- Stitched Spiderweb in Top Left of Photo Window -->
    <g stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,2" opacity="0.8">
      <line x1="35" y1="35" x2="160" y2="35"/>
      <line x1="35" y1="35" x2="135" y2="105"/>
      <line x1="35" y1="35" x2="80" y2="150"/>
      <line x1="35" y1="35" x2="35" y2="160"/>
      <path d="M70 35 Q55 55 35 70" fill="none"/>
      <path d="M115 35 Q85 85 35 115" fill="none"/>
    </g>

    <!-- Photo Placeholder Hint Text -->
    <text x="240" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#c084fc" text-anchor="middle" letter-spacing="2">
      ✦ KHUNG ẢNH SPOOKY ✦
    </text>
    <text x="240" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#94a3b8" text-anchor="middle">
      Kéo thả ảnh tiệc Halloween của bạn vào đây
    </text>

    <!-- BOTTOM POLAROID CAPTION AREA -->
    <text x="50" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#1e1b4b" letter-spacing="1">
      Spooky Night Memories 🎃
    </text>
    <text x="50" y="490" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#7c3aed">
      MEMOUR HANDMADE CRAFT • LIMITED EDITION 2026
    </text>

    <!-- TOP WASHI TAPE STRIP (Orange Stripes with torn ends) -->
    <g transform="translate(160, -14) rotate(4)" filter="url(#sticker-pop)">
      <polygon points="0,0 160,0 156,28 160,32 0,32 4,16" fill="url(#washi-orange-stripes)" stroke="#000000" stroke-width="1.8"/>
      <line x1="10" y1="16" x2="150" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,4"/>
    </g>

    <!-- TOP-RIGHT WASHI TAPE (Purple Dots) -->
    <g transform="translate(360, 15) rotate(45)" filter="url(#sticker-pop)">
      <polygon points="0,0 80,0 78,22 80,26 0,26 2,13" fill="url(#washi-purple-dots)" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- CORNER CRAFT STICKER 1: Jack-o'-lantern Pumpkin (Bottom Right) -->
    <g transform="translate(360, 340)" filter="url(#sticker-pop)">
      <!-- Die-cut white border -->
      <ellipse cx="60" cy="65" rx="58" ry="48" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
      <!-- Pumpkin Stem -->
      <path d="M55 25 C58 10 70 8 72 5 C66 18 64 25 62 27 Z" fill="#65a30d" stroke="#000000" stroke-width="2"/>
      <!-- Pumpkin Body -->
      <ellipse cx="60" cy="65" rx="52" ry="42" fill="#ea580c"/>
      <ellipse cx="38" cy="65" rx="30" ry="38" fill="#f97316"/>
      <ellipse cx="82" cy="65" rx="30" ry="38" fill="#f97316"/>
      <ellipse cx="60" cy="65" rx="20" ry="36" fill="#fb923c"/>
      <!-- Pumpkin Carved Face (Glowing Yellow) -->
      <!-- Eyes -->
      <polygon points="42,55 52,65 35,65" fill="#fef08a" stroke="#000000" stroke-width="1.5"/>
      <polygon points="78,55 85,65 68,65" fill="#fef08a" stroke="#000000" stroke-width="1.5"/>
      <!-- Nose -->
      <polygon points="60,68 65,75 55,75" fill="#fef08a"/>
      <!-- Grin -->
      <path d="M38 78 Q60 100 82 78 Q74 88 68 84 Q62 90 58 84 Q50 88 38 78 Z" fill="#fef08a" stroke="#000000" stroke-width="1.8"/>
    </g>

    <!-- CORNER CRAFT STICKER 2: Friendly Ghost (Top Left) -->
    <g transform="translate(10, 80) rotate(-12)" filter="url(#sticker-pop)">
      <!-- Die-cut outline -->
      <path d="M40 10 C20 10 10 30 10 50 C10 75 5 85 15 88 C25 90 28 82 35 88 C42 94 48 82 55 88 C62 94 68 80 70 50 C70 30 60 10 40 10 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
      <!-- Blushing Cheeks -->
      <ellipse cx="25" cy="42" rx="4" ry="2.5" fill="#f472b6" opacity="0.6"/>
      <ellipse cx="55" cy="42" rx="4" ry="2.5" fill="#f472b6" opacity="0.6"/>
      <!-- Eyes & Mouth -->
      <circle cx="30" cy="36" r="3.5" fill="#000000"/>
      <circle cx="50" cy="36" r="3.5" fill="#000000"/>
      <ellipse cx="40" cy="48" rx="4" ry="6" fill="#000000"/>
      <!-- Pink Hairbow -->
      <path d="M32 15 L22 8 L22 22 Z" fill="#ec4899" stroke="#000000" stroke-width="1.2"/>
      <path d="M48 15 L58 8 L58 22 Z" fill="#ec4899" stroke="#000000" stroke-width="1.2"/>
      <circle cx="40" cy="15" r="4" fill="#f43f5e" stroke="#000000" stroke-width="1"/>
    </g>

    <!-- CORNER CRAFT STICKER 3: Origami Bat -->
    <g transform="translate(380, 20) rotate(15)" filter="url(#sticker-pop)">
      <polygon points="50,20 20,5 28,30 5,28 22,45 35,42 50,55 65,42 78,45 95,28 72,30 80,5" fill="#a855f7" stroke="#000000" stroke-width="2"/>
      <circle cx="44" cy="32" r="2.5" fill="#facc15"/>
      <circle cx="56" cy="32" r="2.5" fill="#facc15"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="lay-sh-05" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(70, 30)" filter="url(#lay-sh-05)">
    <!-- Ornate Mirror Base -->
    <ellipse cx="230" cy="270" rx="200" ry="250" fill="#3b0764" stroke="#000" stroke-width="3"/>
    <ellipse cx="230" cy="270" rx="180" ry="230" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
    <ellipse cx="230" cy="270" rx="170" ry="220" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Mirror Glass Aperture -->
    <ellipse cx="230" cy="270" rx="150" ry="195" fill="#1e1b4b" stroke="#7c3aed" stroke-width="3"/>
    <text x="230" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#c084fc" text-anchor="middle">GƯƠNG MA THUẬT</text>
    <text x="230" y="290" font-family="'Patrick Hand', cursive" font-size="16" fill="#fde047" text-anchor="middle">Magic Mirror On The Wall</text>

    <!-- Top Crown Crest -->
    <polygon points="230,10 205,35 255,35" fill="#facc15" stroke="#000" stroke-width="2"/>
    <circle cx="230" cy="15" r="4" fill="#f43f5e"/>
    <!-- Bottom Handle -->
    <rect x="215" y="520" width="30" height="20" rx="6" fill="#facc15" stroke="#000" stroke-width="2"/>
  </g>
</svg>
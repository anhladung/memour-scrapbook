    <path d="M50 120 L62 180 C65 185 135 185 138 180 L150 120 C165 110 160 80 145 75 C145 50 115 40 100 40 C85 40 55 50 55 75 C40 80 35 110 50 120 Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>

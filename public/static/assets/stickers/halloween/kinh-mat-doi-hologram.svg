<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sh-glass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="lens-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <g filter="url(#sh-glass)">
    <!-- Die cut -->
    <path d="M20 90 C30 65 85 70 95 95 C105 70 160 65 180 90 C190 120 155 140 120 135 C105 130 100 115 100 115 C100 115 95 130 80 135 C45 140 10 120 20 90 Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
    <!-- Bat wings frame -->
    <path d="M25 92 C35 70 85 75 95 98 C105 75 155 70 175 92 C185 118 155 136 122 130 C108 126 100 112 100 112 C100 112 92 126 78 130 C45 136 15 118 25 92 Z" fill="#09090b" stroke="#7c3aed" stroke-width="2"/>
    <!-- Left Lens -->
    <ellipse cx="62" cy="105" rx="26" ry="18" fill="url(#lens-grad)"/>
    <!-- Right Lens -->
    <ellipse cx="138" cy="105" rx="26" ry="18" fill="url(#lens-grad)"/>
    <!-- Glare -->
    <line x1="52" y1="95" x2="68" y2="115" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="128" y1="95" x2="144" y2="115" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
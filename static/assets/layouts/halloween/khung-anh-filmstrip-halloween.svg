    <rect x="340" y="48" width="145" height="204" rx="6" fill="#181126" stroke="#84cc16" stroke-width="2"/>
    <text x="412" y="145" font-family="'Patrick Hand', cursive" font-size="14" fill="#a3e635" text-anchor="middle">ẢNH KỶ NIỆM 03</text>

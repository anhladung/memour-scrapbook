<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="sticker-sh5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sticker-sh5)">
    <!-- White Die-Cut Border -->
    <path d="M 10 75 L 55 35 L 75 62 L 95 38 L 105 38 L 125 62 L 145 35 L 190 75 L 165 130 L 100 110 L 35 130 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Bat Body (Violet Origami Paper) -->
    <path d="M 14 78 L 55 40 L 75 65 L 96 42 L 104 42 L 125 65 L 145 40 L 186 78 L 162 126 L 100 108 L 38 126 Z" 
          fill="#581c87"/>
    
    <!-- Wing Fold Facets (Origami Paper Shading) -->
    <polygon points="100,108 55,40 14,78" fill="#6b21a8"/>
    <polygon points="100,108 145,40 186,78" fill="#4c1d95"/>
    <polygon points="100,108 75,65 55,40" fill="#7c3aed"/>
    <polygon points="100,108 125,65 145,40" fill="#6d28d9"/>

    <!-- Fold Crease Dashed Stitch Lines -->
    <line x1="100" y1="42" x2="100" y2="108" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="55" y1="40" x2="100" y2="108" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="145" y1="40" x2="100" y2="108" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Kawaii Eyes (Lime Green Sparkle) -->
    <circle cx="92" cy="72" r="5" fill="#a3e635"/>
    <circle cx="93" cy="71" r="2" fill="#09090b"/>
    <circle cx="108" cy="72" r="5" fill="#a3e635"/>
    <circle cx="109" cy="71" r="2" fill="#09090b"/>

    <!-- Tiny Vampire Fangs -->
    <polygon points="96,82 98,88 100,82" fill="#ffffff"/>
    <polygon points="100,82 102,88 104,82" fill="#ffffff"/>
  </g>
</svg>

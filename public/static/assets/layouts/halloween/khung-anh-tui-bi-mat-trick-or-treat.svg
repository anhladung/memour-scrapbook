<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="lay-sh-09" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g transform="translate(60, 50)" filter="url(#lay-sh-09)">
    <!-- Base Page -->
    <rect x="0" y="0" width="480" height="500" rx="16" fill="#fff7ed" stroke="#000" stroke-width="3"/>
    
    <!-- Pocket Back / Photo pulled out slightly -->
    <g transform="translate(50, 40) rotate(-3 190 140)">
      <rect x="0" y="0" width="380" height="260" rx="10" fill="#181126" stroke="#000" stroke-width="2.5"/>
      <text x="190" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#fde047" text-anchor="middle">ẢNH KÉO TRONG TÚI BÍ MẬT</text>
      <text x="190" y="155" font-family="'Patrick Hand', cursive" font-size="15" fill="#f97316" text-anchor="middle">Rút ảnh để xem điều bất ngờ!</text>
      <rect x="150" y="240" width="80" height="15" rx="4" fill="#a855f7"/>
      <text x="190" y="252" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">PULL ME</text>
    </g>

    <!-- Pocket Envelope Front -->
    <path d="M40 220 L240 340 L440 220 L440 470 L40 470 Z" fill="#7c3aed" stroke="#000" stroke-width="3"/>
    <!-- Flap Fold Line -->
    <line x1="40" y1="220" x2="440" y2="220" stroke="#fde047" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="240" y="420" font-family="'Patrick Hand', cursive" font-weight="800" font-size="22" fill="#fde047" text-anchor="middle">✦ TRICK OR TREAT POCKET ✦</text>
  </g>
</svg>
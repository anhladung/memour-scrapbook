<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- White Die-Cut Border with Drop Shadow for Scrapbook Look -->
  <defs>
    <filter id="sticker-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sticker-sh)">
    <!-- White Sticker Outline -->
    <path d="M 60 40 C 30 40 10 65 10 105 C 10 145 30 170 70 170 C 80 170 90 166 100 160 C 110 166 120 170 130 170 C 170 170 190 145 190 105 C 190 65 170 40 140 40 C 128 40 115 46 100 52 C 85 46 72 40 60 40 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Green Stem with Stitch -->
    <path d="M 96 22 C 92 10 104 5 112 8 C 108 20 105 32 104 44 Z" fill="#65a30d" stroke="#365314" stroke-width="2"/>
    <line x1="102" y1="12" x2="100" y2="35" stroke="#ecfccb" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Pumpkin Body Ribs -->
    <path d="M 100 48 C 70 48 40 68 40 108 C 40 148 70 165 100 165 C 130 165 160 148 160 108 C 160 68 130 48 100 48 Z" fill="#ea580c"/>
    <path d="M 65 54 C 38 64 24 85 24 108 C 24 138 42 160 65 160 C 74 160 80 150 84 138 C 66 129 60 102 65 54 Z" fill="#f97316"/>
    <path d="M 135 54 C 162 64 176 85 176 108 C 176 138 158 160 135 160 C 126 160 120 150 116 138 C 134 129 140 102 135 54 Z" fill="#fb923c"/>
    
    <!-- Hipster Round Glasses -->
    <circle cx="75" cy="95" r="22" fill="#09090b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="75" cy="95" r="17" fill="#fef08a"/>
    <polygon points="75,85 68,98 82,98" fill="#c2410c"/>

    <circle cx="125" cy="95" r="22" fill="#09090b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="125" cy="95" r="17" fill="#fef08a"/>
    <polygon points="125,85 118,98 132,98" fill="#c2410c"/>

    <!-- Bridge -->
    <path d="M 97 92 Q 100 86 103 92" stroke="#09090b" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Happy Carved Smile -->
    <path d="M 70 125 Q 100 152 130 125 Q 120 144 100 144 Q 80 144 70 125 Z" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
    <polygon points="86,128 92,137 98,130" fill="#ea580c"/>

    <!-- Washi Tape Band on Pumpkin -->
    <g transform="translate(110, 140) rotate(-15)">
      <rect x="0" y="0" width="60" height="20" rx="3" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
      <text x="30" y="14" font-family="'Patrick Hand', cursive, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">BOO! ✦</text>
    </g>
  </g>
</svg>

    <ellipse cx="65" cy="126" rx="9" ry="7" fill="#27272a" stroke="#ffffff" stroke-width="1.5"/>
    <ellipse cx="135" cy="126" rx="9" ry="7" fill="#27272a" stroke="#ffffff" stroke-width="1.5"/>


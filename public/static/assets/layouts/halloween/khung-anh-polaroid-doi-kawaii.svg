<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="lay-sh-03" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Card 1 Left tilted -->
  <g transform="translate(60, 90) rotate(-6 130 180)" filter="url(#lay-sh-03)">
    <rect x="0" y="0" width="260" height="340" rx="12" fill="#fff" stroke="#000" stroke-width="3"/>
    <rect x="18" y="18" width="224" height="230" rx="8" fill="#181126" stroke="#000" stroke-width="2"/>
    <text x="130" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#c084fc" text-anchor="middle">ẢNH BESTIE #1</text>
    <text x="130" y="295" font-family="'Patrick Hand', cursive" font-weight="800" font-size="18" fill="#7c3aed" text-anchor="middle">Ghost Bestie ✦</text>
  </g>
  <!-- Card 2 Right tilted overlapping -->
  <g transform="translate(280, 110) rotate(5 130 180)" filter="url(#lay-sh-03)">
    <rect x="0" y="0" width="260" height="340" rx="12" fill="#fff" stroke="#000" stroke-width="3"/>
    <rect x="18" y="18" width="224" height="230" rx="8" fill="#181126" stroke="#000" stroke-width="2"/>
    <text x="130" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#facc15" text-anchor="middle">ẢNH BESTIE #2</text>
    <text x="130" y="295" font-family="'Patrick Hand', cursive" font-weight="800" font-size="18" fill="#ea580c" text-anchor="middle">Boo Together! ✨</text>
    <!-- Paperclip at top -->
    <path d="M120 -15 L120 25 C120 32 135 32 135 25 L135 -10 C135 -18 112 -18 112 -10 L112 28" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>